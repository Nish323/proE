version: "3"
services:
  react-app:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - TZ=Asia/Tokyo
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    tty: true
    volumes:
      - shared_data:/app/shared
    ports:
      - "8888:80"
    environment:
      - TZ=Asia/Tokyo
    networks:
      - db_model

  model:
    build:
      context: ./model
      dockerfile: Dockerfile
    volumes:
      - shared_data:/app/shared
    environment:
      - TZ=Asia/Tokyo
    tty: true
    depends_on:
      - mysql
    networks:
      - db_model

  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: project-e
      MYSQL_DATABASE: ble_db
      MYSQL_USER: project-e
      MYSQL_PASSWORD: project-e
      TZ: Asia/Tokyo
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - db_model

networks:
  db_model:
    driver: bridge

volumes:
  shared_data:
    driver: local
  mysql_data:
    driver: local
